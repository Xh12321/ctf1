name: netlab
on:
  workflow_dispatch:
  push:
    branches:
      - '**'
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: run probe script
        run: |
          set +e
          bash netlab/run.sh 2>&1 | tee netlab-out.txt
        continue-on-error: true
      - name: upload output
        uses: actions/upload-artifact@v4
        with:
          name: netlab-out
          path: netlab-out.txt
          if-no-files-found: ignore
